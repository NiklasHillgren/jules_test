openapi: 3.0.3

info:
  description: |
    Ordering Domain API. Versioning is done by media type (more on the topic https://opensource.zalando.com/restful-api-guidelines/#114)
  version: "1.0.0-oas3"
  title: Order API
  contact:
    email: michael.x.borek@teliacompany.com
  license:
    name: Telia.dk
    url: 'http://www.telia.dk'
tags:
  - name: Order
    description: Order placing and lookup

paths:

  '/customers/{id}/orders':
    get:
      tags:
        - Order
      summary: Returns orders for given customer ordered by creationDate
      operationId: getOrdersByCustomerId
      parameters:
        - $ref: '#/components/parameters/x-correlation-id-HEADER'
        - $ref: '#/components/parameters/x-application-id-HEADER'
        - $ref: '#/components/parameters/id-PATH'
        - $ref: '#/components/parameters/from-QUERY'
        - $ref: '#/components/parameters/to-QUERY'
        - $ref: '#/components/parameters/limit-QUERY'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollectionResponse'
        '203':
          description: Operation partially succeeded, one of the backend systems is down and the response may contain only subset of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollectionResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "200"
          203:
            statusCode: "203"
          5\d{2}:
            statusCode: "500"
        type: http
        httpMethod: GET
        connectionType: VPC_LINK
        connectionId: '${stageVariables.vpcLinkId}'
        uri: 'http://${stageVariables.networkLoadbalancer}:9250/api/customers/{id}/orders'
        requestParameters:
          integration.request.header.x-correlation-id: method.request.header.x-correlation-id
          integration.request.header.x-application-id: method.request.header.x-application-id
          integration.request.path.id: method.request.path.id
          integration.request.querystring.from: method.request.querystring.from
          integration.request.querystring.to: method.request.querystring.to
          integration.request.querystring.limit: method.request.querystring.limit

    post:
      tags:
        - Order
      summary: Places order made by existing identified customer.
      operationId: placeOrdersOfExistingCustomers
      parameters:
        - $ref: '#/components/parameters/x-correlation-id-HEADER'
        - $ref: '#/components/parameters/x-application-id-HEADER'
        - $ref: '#/components/parameters/id-PATH'
        - $ref: '#/components/parameters/brand-HEADER'
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid Order Structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid Order Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderV1_0'
        description: Order for change or new product
        required: true
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: 201
          400:
            statusCode: 400
          422:
            statusCode: 422
          5\d{2}:
            statusCode: 500
        type: http
        httpMethod: POST
        connectionType: VPC_LINK
        connectionId: '${stageVariables.vpcLinkId}'
