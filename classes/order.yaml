externalDocs:
  description: Find out more about Swagger
  url: 'http://swagger.io'

components:
  parameters:
    x-correlation-id-HEADER:
      name: x-correlation-id
      in: header
      description: Client should provide this tracing header, otherwise it will be created internally
      required: false
      schema:
        type: string
    x-application-id-HEADER:
      name: x-application-id
      in: header
      description: Client should provide this application-id header to track what application has issued the particular request and adapt the server business logic.
      required: false
      schema:
        $ref: '#/components/schemas/ApplicationId'
    brand-HEADER:
      in: header
      name: brand
      description: brand identifier
      schema:
        $ref: '#/components/schemas/Brand'
    id-PATH:
      in: path
      name: id
      description: id of accessed resource
      required: true
      schema:
        type: string
    guid-PATH:
      in: path
      name: guid
      description: GUID of an order
      required: true
      schema:
        type: string
    application-id-QUERY:
      name: application_id
      in: query
      description: Client should provide this application-id header to track what application has issued the particular request and adapt the server business logic.
      required: false
      schema:
        $ref: '#/components/schemas/ApplicationId'
    brands-QUERY:
      in: query
      name: brands
      description: comma separated list of brands
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Brand'
    receiver-email-QUERY:
      in: query
      name: receiver_email
      description: email address of receiver of handover orders
      schema:
        type: string
    cpr-QUERY:
      in: query
      name: cpr
      description: CPR of the physical person
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 10
    ban-QUERY:
      in: query
      name: ban
      description: Billing Account Number
      schema:
        type: string
        minLength: 7
        maxLength: 12
    msisdn-QUERY:
      in: query
      name: msisdn
      description: msisdn
      schema:
        type: string
        minLength: 10
        maxLength: 10
    subscription-id-QUERY:
      in: query
      name: subscription_id
      description: subscription id
      schema:
        type: string
        minLength: 1
        maxLength: 11
    credit-evaluation-id-QUERY:
      in: query
      name: credit_evaluation_id
      description: Credit evaluation id
      schema:
        type: string
    order-states-QUERY:
      in: query
      name: order_states
      description: comma separated list of order processing statuses
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProcessingStatus'
    from-QUERY:
      in: query
      name: from
      schema:
        type: string
        format: date-time
        description: specifies lowest order creation date filter
    to-QUERY:
      in: query
      name: to
      schema:
        type: string
        format: date-time
        description: specifies highest order creation date filter
    limit-QUERY:
      in: query
      name: limit
      schema:
        type: integer
        description: The numbers of items to return
    dealer-code-QUERY:
      in: query
      name: dealer_code
      schema:
        type: string
        description: Dealer code
    sales-agent-id-QUERY:
      in: query
      name: sales_agent_id
      schema:
        type: string
        description: Sales agent ID
    next-link-QUERY:
      in: query
      name: nextLink
      schema:
        type: string
        description: next link param
    serial-number-QUERY:
      in: query
      name: serial_number
      schema:
        type: string
        description: Serial number
    cvr-QUERY:
      in: query
      name: cvr
      schema:
        type: string
        description: cvr
    circuit-id-QUERY:
      in: query
      name: circuit_id
      schema:
        type: string
        description: circuit id
    channel-QUERY:
      in: query
      name: channel
      schema:
        type: string
        description: channel identifier
    created-by-QUERY:
      in: query
      name: createdBy
      schema:
        type: string
        description: Email or other identifier of customer or person who created the order.

  schemas:

    ProcessingStatus:
      type: string
      description: Status of whole order (calculated from orderItems)
      enum:
        - RECEIVED
        - SUBMITTED
        - PROCESSING
        - FAILED
        - CANCELLED
        - COMPLETED
        - DRAFT

    Brand:
      type: string
      description: list of brands
      enum:
        - teliadk
        - callme
        - mittele

    ApplicationId:
      type: string
      description: list of application ids
      enum:
        - document-api
        - DIVA
        - POINT_OF_SALES
        - ENTERPRISE_SELF_SERVICE
        - DK-RPA-BluePrism
        - SIMPLE_QUEUE_SERVICE

    OrderResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrderV1_0'

    OrderCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderV1_0'
        pageSize:
          type: integer
        nextLink:
          type: string
          description: Link to the next page of orders.

    OrderV1_0:
      type: object
      required:
        - dealer
        - segment
        - channel
        - orderParts
      properties:
        id:
          type: string
          description: Id from internal order database, is numeric value and starting from 10000.
          readOnly: true
        orderId:
          type: string
          description: Can be BPM orderID like 'BPMT0153200309110744' or just Order Id from OrderManager '99089093'.
          readOnly: true
        parentOrderId:
          type: string
          description: Parent order id if this order is a return of another order.
        channelOrderReference:
          type: string
          description: order identified made by channel.
        implementationCaseId:
          type: string
          description: Implementation case Id coming from SalesForce channel.
        bpmOrderId:
          type: string
          description: Bpm order id returned from CoPE services.
        noosOrderId:
          type: string
          description: NOOS order id.
        mitIdVerificationToken:
          type: string
          description: Token used for verification of the identity of the person making the order.
        batchId:
          type: string
          description: Identifier of the batch the order is being processed in.
        brand:
          $ref: '#/components/schemas/Brand'
          description: must be entered in the 'brand' header and is then placed on the order.
          readOnly: true
        channel:
          type: string
          description: Identifying what channel the order is made in, e.g. SALES_FORCE, TANGO, SELF_SERVICE ...
        dealer:
          $ref: '#/components/schemas/Dealer'
        segment:
          type: string
          enum:
            - B2C
            - B2B
        createdDate:
          type: string
          format: date-time
          description: Date time with timezone according to ISO-8601.
          readOnly: true
        completedDate:
          type: string
          format: date-time
          description: Date time with timezone according to ISO-8601. Timestamp of when the order has been completed or cancelled.
          readOnly: true
        createdBy:
          type: string
          description: 'Identifier of the person making this order.'
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
          readOnly: true
        processingStatusDetail:
          type: string
          readOnly: true
        creditEvaluationDetails:
          $ref: '#/components/schemas/CreditEvaluationDetails'
        notificationRecipients:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRecipient'
        validationErrors:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ValidationError'
        hasValidationErrors:
          type: boolean
          readOnly: true
        flags:
          $ref: '#/components/schemas/OrderFlags'
        orderer:
          $ref: '#/components/schemas/PartyRole'
        orderParts:
          type: array
          description: The order can have multiple order parts not requiring to be on account (e.g. subscription product change or sales of accessories).
          items:
            $ref: '#/components/schemas/OrderPart'
        hardwareDeliveries:
          type: array
          description: Multiple hardware deliveries allow deliveries to multiple locations.
          items:
            $ref: '#/components/schemas/HardwareDelivery'
        taskUrl:
          type: string
          readOnly: true
          description: Link to task for order manual handling.
        orderTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of all one time fees, charges, and additional product one time price (like hardware price.
        orderMinimumPrice:
          $ref: '#/components/schemas/Amount'
        hardwareTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of hardware amount to be paid.
          deprecated: true
        hardwareTotalUpfront:
          $ref: '#/components/schemas/PaymentAmount'
          description: Sum of hardware upfront amount (to be paid immediately).
          deprecated: true
        productTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of product amount.
        productTotalUpfront:
          $ref: '#/components/schemas/PaymentAmount'
          description: Sum of product upfront amount (to be paid immediately).
        servicesRecurringTotal:
          $ref: '#/components/schemas/Amount'
          description: All services recurring prices.
        orderSource:
          $ref: '#/components/schemas/OrderSource'
        confirmationUrl:
          type: string
        documentsUrl:
          type: string
        paymentId:
          type: string
          description: Id of related payment entity in PaymentIntegrationLayer API.
        payment:
          $ref: '#/components/schemas/PilPayment'
        documents:
          type: array
          description: Set of documents
          items:
            $ref: '#/components/schemas/Document'
        consents:
          $ref: '#/components/schemas/MarketingConsents'
        contextId:
          type: integer
          description: Context id to be used as header for NOOS Orders

    OrderPatchRequests:
      type: array
      description: List of OrderPatchRequests
      items:
        $ref: '#/components/schemas/OrderPatchRequest'

    OrderPatchRequest:
      type: object
      properties:
        op:
          type: string
          description: Operation to do
          enum:
            - add
            - remove
            - replace
            - move
            - copy
        path:
          type: string
        value:
          type: object
        from:
          type: string

    SplitPaymentPatchRequest:
      type: object
      properties:
        totalPaymentAmount:
          description: Total payment amount
          $ref: '#/components/schemas/PaymentAmount'
          required: true
        upfrontPaymentAmount:
          description: The amount paid upfront
          $ref: '#/components/schemas/PaymentAmount'
        downPaymentAmount:
          description:
          $ref: '#/components/schemas/PaymentAmount'
        numberOfInstallments:
          type: number

    HomeOfficeOrderPatch:
      type: object
      properties:
        legalParty:
          $ref: '#/components/schemas/Person'
        billingParty:
          $ref: '#/components/schemas/Person'
        installationAddress:
          $ref: '#/components/schemas/InstallationAddress'
        recipientParty:
          $ref: '#/components/schemas/Person'
        vendor:
          type: string
        employeeId:
          type: string
          description: Id of employee

    ChangeActivationDateOrderPatch:
      type: object
      required:
        - teliaCircuitId
        - newActivationDate
      properties:
        teliaCircuitId:
          type: string
        newActivationDate:
          type: string
          format: date
          description: New activation date in format YYYY-MM-DD (according to ISO 8601).

    PaymentType:
      type: string
      enum:
        - EXTERNAL_PAYMENT_SERVICE
        - INVOICE
        - SHOP

    HardwarePaymentConfigurationPatch:
      type: object
      properties:
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        totalPayment:
          $ref: '#/components/schemas/PaymentAmount'
        upfrontPayment:
          $ref: '#/components/schemas/PaymentAmount'
        downPayment:
          $ref: '#/components/schemas/PaymentAmount'
        discount:
          $ref: '#/components/schemas/Discount'
        numberOfInstallments:
            type: number

    OrderAdditionalInfoPatch:
      type: object
      properties:
        orderMemo:
            type: string

    PortingDetailsUpdate:
      type: object
      required:
        - telephoneNumber
      properties:
        telephoneNumber:
          $ref: '#/components/schemas/TelephoneNumber'
        donorSimNumber:
          type: string
        donorConsent:
          $ref: '#/components/schemas/Consent'
        portingProcessConditionsConsent:
          $ref: '#/components/schemas/Consent'

    Consent:
      type: object
      properties:
        writtenConsentGiven:
          type: boolean
          default: false
        consentById:
          $ref: '#/components/schemas/PhysicalIdentification'

    PhysicalIdentification:
      required:
        - type
        - value
      type: object
      properties:
        type:
          type: string
        value:
          type: string

    OrderSource:
      type: object
      properties:
        ipAddress:
          type: string
        port:
          type: number
          format: int32
        captureTimeStamp:
          type: string
          format: date-time
          description: Date time with timezone according to ISO-8601. Timestamp of when the order has been completed or cancelled.


    CreditEvaluationDetails:
      type: object
      description: Details of credit evaluation, so that it can be retried.
      properties:
        employmentType:
          type: string
          enum:
            - EMPLOYEE
            - HOMEMAKERS
            - RETIRED
            - SELF_EMPLOYED
            - STUDENT
            - UNEMPLOYED
            - OTHER
            - UNKNOWN
        residentialStatus:
          type: string
          enum:
            - COOPERATIVE
            - CONDOMINIUM
            - LIVING_HOME
            - RENTING
            - OTHER
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        creditLimit:
          type: number
          format: decimal
          description: Comes from credit check
        creditClass:
          type: string
          description: Comes from credit check

    OrderFlags:
      type: object
      description: Container for various order related flags.
      properties:
        orderConfirmed:
          type: boolean
          description: Whether the order is confirmed or approved.
        termsAccepted:
          type: boolean
          description: If customer agrees with terms and conditions. Must be true :)
        cprCheckFailed:
          type: boolean
          description: If the CPR check failed.
        creditCheckFailed:
          type: boolean
          description: When the credit check failed.
        needsConfirmation:
          type: boolean
          description: Customer shall confirm the order as sales agent made it on their behalf.
        membershipCheck:
          type: boolean
          description: If there is any membership to be checked (voucher number or so)
        dirty:
          type: boolean
          description: The order is missing mandatory information
        doCommunication:
          type: boolean
          description: Shall the backend send communication
        doLogistics:
          type: boolean
          description: Shall the backend send request for hardware shipment
        addCharge:
          type: boolean
        posFlow:
          type: boolean
          description: Order has been created via new POS
        homeOfficeOrder:
          type: boolean
          description: If order represents Home Office order
        createDraftOrder:
          type: boolean
          description: If draft order should be created during shopping cart submission
        manualSigning:
          type: boolean
          description: If order follows manual signing flow
        simOnly:
          type: boolean
          description: If order is from Tango and has only SIM AdditionalProductItems
        hasUpfrontPayment:
          type: boolean
          description: If order is from Tango and has at least one upfront payment on any HardwarePaymentItem
        tfFinancingNeeded:
          type: boolean
          description: If order is from Tango and has at least one down payment on any HardwarePaymentItem
        physicalIdPreidentified:
          type: boolean
          description: If order is from Tango and order was sold in shop
        shopSales:
          type: boolean
          description: If order is from Tango and order was sold in external store
        orderExpired:
          type: boolean
          description: If order is already expired.
        newDivaFlow:
          type: boolean
          description: Go with the new DIVA flow.
        isSubOrder:
          type: boolean
          description: If order is a sub order. Applies to return orders.

    HardwareDelivery:
      type: object
      description: Specifies delivery details for related hardware items on the order.
      required:
        - id
        - recipientParty
        - deliveryPrice
        - deliveryMethod
        - preferredContactMethod
      properties:
        id:
          type: integer
          description: Unique identifier of hardware delivery.
        recipientParty:
          $ref: '#/components/schemas/PartyRole'
        billingParty:
          $ref: '#/components/schemas/PartyRole'
        deliveryMethod:
          type: string
          description: String identifier of delivery method.
        deliveryPrice:
          $ref: '#/components/schemas/Amount'
        preferredContactMethod:
          type: string
          enum:
            - PHONE
            - EMAIL
        dispatchDate:
          type: string
          format: date-time
          description: Date time with timezone according to ISO-8601. Timestamp of when the hardware has been sent out from warehouse.
          readOnly: true
        prefferedSendDate:
          type: string
          format: date-time


    Dealer:
      type: object
      description: the dealer organization that made the order
      required:
        - dealerCode
      properties:
        dealerCode:
          type: string
          description: code of the dealer like '1018'.
        dealerName:
          type: string
          readOnly: true
          description: name of the dealer like 'BtC Amager'.
        salesAgentCode:
          type: string
          description: shall contain sales agent code (as handled by DealerAdmin), so far not used.
        salesAgentName:
          type: string
          readOnly: true
          description: Name of the sales representative.
        posDealerId:
          type: string
          description: id of the dealer in ODOO
        posSalesAgentId:
          type: string
          description: id of the sales agent in ODOO

    NotificationRecipient:
      type: object
      description: Recipients registered here should be notified upon event that interests given role. So far used only to return recipients on NEO orders.
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - CUSTOMER
            - SALES_AGENT
            - SALES_MANAGER
            - EXTERNAL_SHIPPING_PARTNER
        email:
          type: string
        telephoneNumber:
          type: string

    PartyRole:
      type: object
      discriminator:
        propertyName: type
        mapping:
          PERSON: '#/components/schemas/Person'
          ORGANIZATION: '#/components/schemas/Organization'
      required:
        - type
      properties:
        type:
          type: string
        email:
          type: string
          minLength: 5
        customerId:
          type: string
        telephoneNumber:
          $ref: '#/components/schemas/TelephoneNumber'
        address:
          $ref: '#/components/schemas/Address'

    Person:
      allOf:
        - $ref: '#/components/schemas/PartyRole'
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthday:
          type: string
          format: date
          description: Birthday in format YYYY-MM-DD (according to ISO 8601).
        cpr:
          type: string
          minLength: 10
          maxLength: 10

    Organization:
      allOf:
        - $ref: '#/components/schemas/PartyRole'
      type: object
      required:
        - name
      properties:
        name:
          type: string
        additionalName:
          type: string
        cvr:
          type: string
          minLength: 8
          maxLength: 8

    Address:
      type: object
      description: Parent for all addresses
      discriminator:
        propertyName: type
        mapping:
          DANISH_ADDRESS: '#/components/schemas/DanishAddress'
          UNSTRUCTURED_ADDRESS: '#/components/schemas/UnstructuredAddress'
      required:
        - type
        - city
        - zipCode
        - country
      properties:
        type:
          type: string
          enum:
            - DANISH_ADDRESS
            - UNSTRUCTURED_ADDRESS
        city:
          type: string
        zipCode:
          type: string
        country:
          type: string
        coName:
          type: string
          description: Name of C/O (in care of) person.
        attention:
          type: string
          description: Name of person (recipient). Mainly used for organization addresse where recipient is a specific person.

    DanishAddress:
      allOf:
        - $ref: '#/components/schemas/Address'
      type: object
      description: more info to be found here [http://www.bitboost.com/ref/international-address-formats/denmark/]
      required:
        - streetName
        - streetNumber
      properties:
        streetName:
          type: string
          description: Street name (e.g. Karl Johans Gate)
        streetNumber:
          type: string
          description: "Street number (e.g. 20)"
        streetNumberSuffix:
          type: string
          description: "Usually a letter right after the number (A in 10A, B in 15B)"
        floorNumber:
          type: string
          description: "Floor number identifying the floor (e.g. 5)"
        doorNumber:
          type: string
          description: "Door number identifying the door (e.g. 10)"
        direction:
          type: string
          description: like 'tv' (meaning 'til venstre' -> left)
        locality:
          type: string
          description: for ex. V is the locality in COPENHAGEN V

    UnstructuredAddress:
      allOf:
        - $ref: '#/components/schemas/Address'
      type: object
      required:
        - address1
      properties:
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string

    InstallationAddress:
      type: object
      description: Installation address of device, fixed line and so on.
      required:
        - postalAddress
      properties:
        postalAddress:
          $ref: '#/components/schemas/Address'
        streetCode:
          type: string
        municipalityCode:
          type: string
        siteId:
          type: string
        kvh:
          type: string
        kvhx:
          type: string
        addressRefId:
          type: string
          description: This attribute is sent to LineInquiryAPI as DawaId. The field in LineInquiryAPI request for this is called addressId.

    TelephoneNumber:
      type: object
      description: Telephone number with it's details.
      required:
        - countryCode
        - localNumber
      properties:
        countryCode:
          type: string
          description: country code like '45' for Denmark or '372' for Estonia
        areaCode:
          type: string
          description: local area code
        localNumber:
          type: string
          description: the actual phone number


    ValidationError:
      type: object
      description: Validation errors related to OrderPart or OrderItem are placed here.
      required:
        - errorCode
      properties:
        errorCode:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorParameter'

    ValidationErrorParameter:
      type: object
      required:
        - target
      properties:
        target:
          type: string
        reason:
          type: string

    OrderPart:
      type: object
      description: Order Part - container for LineItems belonging together
      required:
        - type
        - activity
      properties:
        references:
          type: array
          description: Used to refer to existing entities like account or subscription. When ordering new additionalProduct on subscription, place subscription identifier here.
          items:
            $ref: '#/components/schemas/OrderPartReference'
        type:
          type: string
          enum:
            - ACCOUNT
            - SUBSCRIPTION
            - HARDWARE
        activity:
          type: string
          enum:
            - CREATE
            - CHANGE
            - TERMINATE
            - SUSPEND
            - REACTIVATE
        changeTypes:
          type: array
          description: a Set of the types of changes contained in the orderpart
          items:
            type: string
            enum:
              - PRICEPLAN
              - HANDOVER
              - CALL_FORWARDING
              - SIMCARD
              - ADDITIONAL_PRODUCTS
          readOnly: true
        processingStatus:
          $ref: '#/components/schemas/ProcessingStatus'
        processingStatusDetail:
          type: string
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        orderParts:
          type: array
          items:
            $ref: '#/components/schemas/OrderPart'
        validationErrors:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ValidationError'
        id:
          type: integer
          description: Identifies the element in collection uniquely in whole order. Is assigned by OrderAPI.
          readOnly: true
        channelOrderPartId:
          type: string
          description: Intended to identify the element uniquely in whole order. Can be assigned by external services.
          readOnly: false
        splitOrderId:
          type: string
          description: Intended to identify the element uniquely in whole order. Is assigned by OrderAPI.
          readOnly: true
        taskUrl:
          type: string
          description: Link to task for manual handling of the orderPart.
          readOnly: true
        partTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of all one time fees, charges, and additional product one time price (like hardware price).
        hardwareTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of hardware amount.
          deprecated: true
        hardwareTotalUpfront:
          $ref: '#/components/schemas/PaymentAmount'
          description: Sum of hardware upfront amount (to be paid immediately).
          deprecated: true
        productTotal:
          $ref: '#/components/schemas/Amount'
          description: Sum of product amount.
        productTotalUpfront:
          $ref: '#/components/schemas/PaymentAmount'
          description: Sum of product upfront amount (to be paid immediately).
        servicesRecurringTotal:
          $ref: '#/components/schemas/Amount'
          description: All services recurring prices.
        hardwareRecurringTotal:
          $ref: '#/components/schemas/PaymentAmount'
          description: All hardware installment recurring payments per month.


