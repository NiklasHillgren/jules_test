          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorContent'

    ErrorContent:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        message:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ErrorParameter'

    ErrorParameter:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
