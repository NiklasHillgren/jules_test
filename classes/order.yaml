        actualPortingDate:
          type: string
          format: date
          readOnly: true
          description: The date at which the porting is planned. Date in format YYYY-MM-DD (according to ISO 8601).
        donorConsent:
          $ref: '#/components/schemas/Consent'
        portingProcessConditionsConsent:
          $ref: '#/components/schemas/Consent'

